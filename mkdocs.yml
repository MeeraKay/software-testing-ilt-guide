site_name: Software Testing ILT Guide
site_description: UiPath Software & Agentic Testing Instructor-Led Training
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: light
      primary: red
      accent: blue
    - scheme: dark
      primary: blue
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables

nav:
