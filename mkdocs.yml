site_name: Software Testing ILT Guide
site_description: UiPath Software & Agentic Testing Instructor-Led Training
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: light
      primary: blue
      accent: blue
    - scheme: dark
      primary: blue
      accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - toc.integrate

extra:
  generator: false

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/mermaid.min.js
  - assets/js/mermaid-init.js
  - assets/js/sidebar-toggle.js

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables

